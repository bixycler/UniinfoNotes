<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Process Text — Replace Quotes</title>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; margin: 24px; }
        textarea { width: 100%; height: 200px; font-size: 16px; padding: 8px; box-sizing: border-box; }
        .controls { margin: 12px 0; display: flex; gap: 8px; align-items: center; }
        .label { font-size: 14px; color: #444; }
    </style>
</head>
<body>
    <h1>Replace Straight Quotes with Curly Quotes</h1>

    <script src="common-utils.js"></script>

    <label class="label" for="source">Source text</label>
    <textarea id="source" placeholder="Paste or type text with straight quotes here"></textarea>

    <div class="controls">
        <button id="replaceBtn" type="button">Replace Quotes</button>
        <button id="clearBtn" type="button">Clear</button>
        <label style="margin-left:12px"><input id="live" type="checkbox"> Live update</label>
    </div>

    <label class="label" for="result">Result</label>
    <textarea id="result" readonly placeholder="Result will appear here"></textarea>

    <script>
        // Expects replaceQuotes(text) to be defined in common-utils.js
        const src = document.getElementById('source');
        const res = document.getElementById('result');
        const btn = document.getElementById('replaceBtn');
        const clearBtn = document.getElementById('clearBtn');
        const live = document.getElementById('live');

        function applyReplace() {
            if (typeof replaceQuotes !== 'function') {
                console.error('replaceQuotes() is not defined. Ensure common-utils.js is loaded and path is correct.');
                res.value = src.value;
                return;
            }
            res.value = replaceQuotes(src.value);
        }

        btn.addEventListener('click', applyReplace);
        clearBtn.addEventListener('click', () => { src.value = ''; res.value = ''; });
        src.addEventListener('input', () => { if (live.checked) applyReplace(); });
    </script>
</body>
</html></div>
